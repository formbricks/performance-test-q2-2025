name: Formbricks core suite validation

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/formbricks-core-validate.yml"
      - "scripts/formbricks-core/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # main, 2026-09-27
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main, 2026-09-27

      - name: Install k6
        uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # main, 2026-09-27
        with:
          k6-version: "2.0.0"

      - name: Validate offline suite
        run: ./scripts/formbricks-core/tests/validate.sh
